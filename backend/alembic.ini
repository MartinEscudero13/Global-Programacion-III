# Configuración de Alembic para la API de la librería.
#
# La URL de conexión no se escribe acá: `migrations/env.py` la toma de la
# variable de entorno DATABASE_URL con `app.core.config.get_settings` y la
# inyecta en tiempo de ejecución. Así el archivo versionado no contiene
# credenciales y el backend tiene una sola fuente de configuración.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
